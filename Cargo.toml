[workspace]
resolver = "2"
members = [
    "crates/p1100-protocol",
    "crates/p1100-raster",
    "crates/p1100-job",
    "crates/p1100-jbig",
    "crates/p1100-filter",
    "crates/p1100-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[profile.release]
lto = true
strip = true
