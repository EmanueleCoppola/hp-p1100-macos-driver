[workspace]
resolver = "2"
members = [
    "crates/p1102-protocol",
    "crates/p1102-raster",
    "crates/p1102-job",
    "crates/p1102-jbig",
    "crates/p1102-filter",
    "crates/p1102-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[profile.release]
lto = true
strip = true
