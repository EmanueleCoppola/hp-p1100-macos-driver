[package]
name = "p1100-filter"
description = "CUPS filter turning application/vnd.cups-raster into ZjStream"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
p1100-raster = { path = "../p1100-raster" }
p1100-job = { path = "../p1100-job" }
p1100-protocol = { path = "../p1100-protocol" }

[[bin]]
name = "p1100-filter"
path = "src/main.rs"

[[bin]]
name = "p1100-usbink"
path = "src/bin/p1100-usbink.rs"
